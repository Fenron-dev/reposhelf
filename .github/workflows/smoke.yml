# SPDX-License-Identifier: GPL-3.0-or-later
# Smoke test of released packages: starts them the way a user would.
name: Smoke test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v0.1.2"
        required: true

permissions:
  contents: read
  packages: read
  actions: write

env:
  TAG: ${{ inputs.tag }}
  TEST_REPO: https://github.com/octocat/Hello-World

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start container
        run: |
          set -e
          mkdir data && sudo chown 99:100 data
          img=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${TAG#v}
          docker run -d --name rs -p 7373:7373 -v "$PWD/data:/data" -e REPOSHELF_ADMIN_TOKEN=smoke-token "$img"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7373/healthz && break; sleep 2; done
          docker logs rs
      - name: Add, sync, clone
        run: |
          set -e
          curl -fsS -H "Authorization: Bearer smoke-token" -H "Content-Type: application/json" \
            -d "{\"url\":\"$TEST_REPO\"}" http://127.0.0.1:7373/api/repos
          for i in $(seq 1 60); do
            st=$(curl -fsS -H "Authorization: Bearer smoke-token" http://127.0.0.1:7373/api/repos | jq -r '.[0].Status')
            echo "status: $st"; [ "$st" = ok ] && break; sleep 3
          done
          [ "$st" = ok ]
          git clone http://x:smoke-token@127.0.0.1:7373/git/github.com/octocat/Hello-World.git clone
          test -f clone/README
          curl -fsS -o /dev/null -w "web without login: %{http_code}\n" http://127.0.0.1:7373/ || true
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Forwarded-For: 1.2.3.4" http://127.0.0.1:7373/settings)
          echo "settings without token: $code"; [ "$code" = 303 ] || [ "$code" = 403 ]
          docker exec rs reposhelf doctor
      - name: Logs
        if: always()
        run: docker logs rs || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "${{ github.repository }}" -p "reposhelf-*-windows-amd64.zip" -p "RepoShelf-Windows-portable.zip"
          7z x -bd -y reposhelf-*-windows-amd64.zip >/dev/null
          7z x -bd -y RepoShelf-Windows-portable.zip >/dev/null
          ls
      - name: CLI with bundled Git
        run: |
          set -e
          cd reposhelf-*-windows-amd64
          test -f git/cmd/git.exe
          # Prefer the bundled Git: hide the runner's Git from PATH.
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vi '/git/' | paste -sd:)
          ./reposhelf.exe version
          ./reposhelf.exe doctor
          ./reposhelf.exe add "$TEST_REPO" --no-releases
          ./reposhelf.exe list
          ./reposhelf.exe grep "Hello"
      - name: CLI server and clone
        run: |
          set -e
          cd reposhelf-*-windows-amd64
          ./reposhelf.exe serve > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7373/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:7373/ | grep -q "Bibliothek"
          git clone http://127.0.0.1:7373/git/github.com/octocat/Hello-World.git ../clone
          test -f ../clone/README
          cat serve.log
          taskkill //F //IM reposhelf.exe || true
      - name: Desktop app starts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\rsdata" | Out-Null
          $env:REPOSHELF_DATA = "$env:RUNNER_TEMP\rsdata"
          $p = Start-Process -FilePath ".\RepoShelf\RepoShelf.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7373/healthz; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          Get-ChildItem "$env:RUNNER_TEMP\rsdata\.reposhelf\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 20 }
          if (-not $ok) { throw "Desktop-App antwortet nicht (beendet: $($p.HasExited))" }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7373/
          if ($page.Content -notmatch "Bibliothek") { throw "Startseite fehlt" }
          Stop-Process -Id $p.Id -Force

  builds:
    # Real builds on a Linux runner with Docker (not allowed locally):
    # reposhelf-build.yaml target, build capsule + offline test, act and
    # GitHub Actions as external runner (T-6.x, T-7.x).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACT_VERSION: "0.2.97"
      ACT_SHA256: "67b4976a56f33ea7870b798912e738ec44eef38e7578ae7b532f2def1c73a5ad"
      RS: "http://127.0.0.1:7373"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build RepoShelf and install act
        run: |
          set -e
          go build -o /tmp/rs ./cmd/reposhelf
          curl -sSL -o /tmp/act.tgz "https://github.com/nektos/act/releases/download/v${ACT_VERSION}/act_Linux_x86_64.tar.gz"
          echo "${ACT_SHA256}  /tmp/act.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/act.tgz -C /usr/local/bin act
          git config --global user.name smoke && git config --global user.email smoke@example.com
      - name: Start server with runner role
        env:
          REPOSHELF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/data
          cat > /tmp/data/reposhelf.yaml <<'YAML'
          schema: 1
          sync:
            paused: true
          runner:
            enabled: true
            confirm: false
            min_free_gb: 1
            capabilities: [linux/amd64, docker]
          YAML
          nohup /tmp/rs serve --data /tmp/data --listen 127.0.0.1:7373 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fs $RS/healthz && break; sleep 1; done
      - name: Create test project and push it
        run: |
          set -e
          /tmp/rs create probe --data /tmp/data
          mkdir /tmp/probe && cd /tmp/probe && git init -q -b main
          cat > go.mod <<'GO'
          module example.com/probe

          go 1.24
          GO
          cat > main.go <<'GO'
          package main

          import (
          	"fmt"

          	"golang.org/x/text/language"
          )

          func main() { fmt.Println(language.German) }
          GO
          go get golang.org/x/text@v0.20.0 && go mod tidy
          cat > reposhelf-build.yaml <<'YAML'
          targets:
            - name: linux
              image: golang:1.24
              commands: ["CGO_ENABLED=0 go build -o dist/probe .", "./dist/probe > dist/output.txt"]
              artifacts: ["dist/*"]
          YAML
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          on: push
          jobs:
            hello:
              runs-on: ubuntu-latest
              steps:
                - run: echo "hello from act"
          YAML
          git add -A && git commit -qm probe && git tag v1.0
          git push -q "$RS/git/local/projekte/probe.git" main --tags
      - name: Real builds
        run: |
          set -e
          build() { # repo target [ref] [version]
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H "Origin: $RS" \
              --data-urlencode "repo=$1" --data-urlencode "target=$2" --data-urlencode "ref=${3:-}" --data-urlencode "version=${4:-}" $RS/builds)
            id=${loc##*/builds/}; echo "== $2 → build $id"; [ -n "$id" ]
            for i in $(seq 1 120); do
              log=$(curl -fs $RS/builds/$id/log)
              case "$log" in *"Fertig."*) echo "$log" | tail -5; return 0 ;; *"FEHLER"*) echo "$log"; return 1 ;; esac
              sleep 5
            done
            echo "timeout"; curl -fs $RS/builds/$id/log; return 1
          }
          build local/projekte/probe linux
          curl -fs "$RS/builds/$id/artifact?name=dist/output.txt" | grep -q de
          build local/projekte/probe capsule v1.0 v1.0
          build local/projekte/probe capsule-test v1.0 v1.0
          build local/projekte/probe "act:ci/hello"
      - name: GitHub Actions as external runner
        env:
          REPOSHELF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          /tmp/rs add https://github.com/${{ github.repository }} --mode manual --no-releases --data /tmp/data
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H "Origin: $RS" \
            --data-urlencode "repo=github.com/${{ github.repository }}" --data-urlencode "target=github:dispatch-probe.yml" $RS/builds)
          id=${loc##*/builds/}; echo "build $id"
          for i in $(seq 1 60); do
            log=$(curl -fs $RS/builds/$id/log)
            case "$log" in *"Fertig."*) echo "$log"; exit 0 ;; *"FEHLER"*) echo "$log"; exit 1 ;; esac
            sleep 10
          done
          echo "$log"; exit 1
      - name: Server log
        if: always()
        run: tail -50 /tmp/serve.log
