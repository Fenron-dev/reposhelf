<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["library","tags","graph","builds","mcp","trash"],"default":"library"},"$preview":{"width":248,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'library';
    const keys = ['library', 'tags', 'graph', 'builds', 'mcp', 'trash'];
    const nav = {};
    keys.forEach((k) => {
      nav[k] = k === active
        ? { bg: '#262115', fg: '#F2B544' }
        : { bg: 'transparent', fg: '#C9CED8' };
    });
    return { nav };
  }
}
